<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Planning PASS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3E7C59">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning PASS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B2430; --ink-soft:#4B5566;
  --paper:#F6F3EC; --card:#FFFFFF; --card-2:#F1EEE5;
  --line:#E4DFD1;
  --accent:#3E7C59; --accent-ink:#183226; --accent-soft:#E1EEE4;
  --amber:#C98A2B; --amber-soft:#F6E9D3;
  --danger:#B0483F; --danger-soft:#F5E1DE;
  --shadow: 0 1px 2px rgba(27,36,48,.06), 0 8px 20px -12px rgba(27,36,48,.18);
  --radius: 14px;
  --hour-px: 56px;
  --font-head: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', system-ui, sans-serif;
}
html[data-theme="dark"]{
  --ink:#EDEAE1; --ink-soft:#B7BCC7;
  --paper:#151A22; --card:#1E2530; --card-2:#232B38;
  --line:#2D3644;
  --accent:#5FAE84; --accent-ink:#EAF6EE; --accent-soft:#20342A;
  --amber:#E0A75C; --amber-soft:#3A2E1B;
  --danger:#E08277; --danger-soft:#3A2320;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-body); font-size:14px;
  -webkit-tap-highlight-color:transparent;
  overflow-x:hidden;
}
h1,h2,h3,.head-font{font-family:var(--font-head);}
button{font-family:inherit; font-size:inherit;}
input,select,textarea{font-family:inherit; font-size:inherit;}
.icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
.icon-sm{width:14px;height:14px;}
.icon-lg{width:22px;height:22px;}
button.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink-soft); cursor:pointer;
  transition:.15s ease;
}
button.iconbtn:hover{color:var(--ink); border-color:var(--accent); background:var(--accent-soft);}
button.iconbtn:active{transform:scale(.94);}
button.pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;font-weight:600;font-size:13px;
  transition:.15s ease;
}
button.pill:hover{border-color:var(--accent);}
button.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;}
button.pill.ghost{background:transparent;}
button.primary{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 16px;border-radius:11px;border:none;background:var(--accent);color:#fff;
  font-weight:700;cursor:pointer; box-shadow:var(--shadow);
}
button.primary:hover{filter:brightness(1.06);}
button.secondary{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-weight:600;cursor:pointer;
}
button.danger-btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  padding:9px 14px;border-radius:11px;border:1px solid var(--danger);background:var(--danger-soft);color:var(--danger);
  font-weight:700;cursor:pointer;
}
button.text-btn{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-weight:600;padding:4px 6px;border-radius:6px;}
button.text-btn:hover{color:var(--accent);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:1900px;margin:0 auto;width:100%;
  padding:env(safe-area-inset-top) calc(18px + env(safe-area-inset-right)) env(safe-area-inset-bottom) calc(18px + env(safe-area-inset-left));}
.topbar{
  display:flex;align-items:center;gap:10px;padding:12px 2px 10px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;}
.brand-text{display:flex;flex-direction:column;line-height:1.1;}
.brand-text b{font-family:var(--font-head);font-size:17px;font-weight:700;}
.brand-text span{font-size:11px;color:var(--ink-soft);}
.deadline-chip{
  display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;
  background:var(--amber-soft);color:var(--amber);border:1px solid transparent;cursor:pointer;font-weight:700;
}
.deadline-chip .num{font-family:var(--font-head);font-size:15px;}
.deadline-chip small{font-weight:600;color:var(--ink-soft);}
.topbar .spacer-actions{display:flex;align-items:center;gap:7px;}

.tabs{display:flex;gap:6px;padding:8px 2px;flex-wrap:wrap;}
.tabs button{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:10px;border:1px solid transparent;
  background:transparent;color:var(--ink-soft);font-weight:700;cursor:pointer;font-size:13px;
}
.tabs button.active{background:var(--card);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow);}
.tabs button .icon{color:var(--accent);display:block;}

main{flex:1;min-height:0;padding-bottom:6px;overflow:hidden;display:flex;flex-direction:column;}
.view{flex:1;min-height:0;display:none;flex-direction:column;}
.view.active{display:flex;}

/* ---------- Week view ---------- */
.week-toolbar{display:flex;align-items:center;gap:8px;padding:2px 2px 6px;}
.week-toolbar .range{font-family:var(--font-head);font-weight:600;font-size:15px;flex:1;}
.week-toolbar .subrange{display:none;}
.week-nav{display:flex;align-items:center;gap:7px;flex-shrink:0;}
.week-wrap{flex:1;min-height:0;display:flex;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
.gutter{width:58px;flex:0 0 58px;border-right:1px solid var(--line);position:relative;background:var(--card-2);}
.gutter-head{height:48px;border-bottom:1px solid var(--line);background:var(--card);}
.gutter .lab{position:absolute;left:0;right:0;transform:translateY(-50%);font-size:10px;color:var(--ink-soft);text-align:right;padding-right:9px;font-weight:600;}
.days-scroll{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;overscroll-behavior-x:contain;}
.day-col{flex:1 1 0;min-width:124px;position:relative;border-right:1px solid var(--line);}
.day-col:last-child{border-right:none;}
.day-head{
  height:48px;position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--line);
  text-align:center;padding:6px 2px;
}
.day-head .dname{font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.day-head .dnum{font-family:var(--font-head);font-size:17px;font-weight:700;margin-top:1px;}
.day-head.today{background:var(--accent-soft);}
.day-head.today .dnum{color:var(--accent);}
.day-body{position:relative;}
.hourline{position:absolute;left:0;right:0;border-top:1px solid var(--line);}
.hourline.half{border-top:1px dashed var(--line);opacity:.5;}
.now-line{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2;}
.now-line::before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger);}
.week-wrap{border-radius:16px;overflow:hidden;}
.days-scroll::-webkit-scrollbar{height:7px;}
.days-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;}
@media (min-width:1100px){.day-col{min-width:0;}}
@media (max-width:700px){
  .gutter{width:52px;flex-basis:52px;}
  .day-col{min-width:116px;}
  .block{left:3px;right:3px;padding:5px 6px;}
  .block .t{font-size:11.5px;}
  .block .s{font-size:10px;}
}

.block{
  position:absolute;left:4px;right:4px;border-radius:8px;padding:6px 8px;overflow:hidden;
  cursor:grab;z-index:1; user-select:none;
  border-left:3px solid; backdrop-filter:blur(5px);
  box-shadow:0 1px 2px rgba(0,0,0,.08);
}
.block:active{cursor:grabbing;z-index:5;}
.block.dragging{opacity:.85;box-shadow:0 8px 20px rgba(0,0,0,.3);}
.block .t{font-weight:700;font-size:13px;line-height:1.3;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;}
.block .s{font-size:11px;opacity:.85;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
.block .s .icon{width:10px;height:10px;}
.block.completed{opacity:.5;}
.block.completed .t{text-decoration:line-through;}
.block.revision{border-left-style:dashed;}

.overload-banner{
  display:flex;align-items:center;gap:9px;background:var(--amber-soft);color:var(--amber);
  border-radius:11px;padding:9px 12px;margin:0 0 8px;font-weight:600;font-size:12.5px;
}
.overload-banner button{margin-left:auto;}
.backup-banner{
  display:flex;align-items:center;gap:10px;background:var(--amber-soft);color:var(--amber);
  border-radius:12px;padding:10px 12px;margin:8px 2px 0;font-weight:600;font-size:12.5px;
}
.backup-banner .icon{flex-shrink:0;}
.backup-banner .txt{flex:1;}
.backup-banner button{flex-shrink:0;}
.backup-banner .bb-actions{display:flex;gap:6px;flex-shrink:0;}

/* ---------- Recherche ---------- */
.search-row{
  display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;cursor:pointer;
}
.search-row:hover{background:var(--card-2);}
.search-row .srn{flex:1;font-weight:600;font-size:13.5px;}
.search-row .srs{font-size:11.5px;color:var(--ink-soft);}

/* ---------- Month view ---------- */
.month-toolbar{display:flex;align-items:center;gap:8px;padding:4px 2px 10px;}
.month-toolbar .range{font-family:var(--font-head);font-weight:600;font-size:16px;flex:1;text-transform:capitalize;}
.month-grid{flex:1;display:grid;grid-template-rows:auto repeat(6,1fr);gap:6px;overflow:auto;}
.month-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-dow div{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;padding-bottom:4px;}
.month-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.month-cell{
  background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px;cursor:pointer;
  display:flex;flex-direction:column;gap:5px;min-height:64px;transition:.12s;
}
.month-cell:hover{border-color:var(--accent);}
.month-cell.other{opacity:.35;}
.month-cell.today{border-color:var(--accent);background:var(--accent-soft);}
.month-cell .dnum{font-weight:700;font-size:13px;}
.month-dots{display:flex;flex-wrap:wrap;gap:3px;}
.month-dots span{width:6px;height:6px;border-radius:50%;display:block;}

/* ---------- Subjects view ---------- */
.subjects-scroll{flex:1;overflow-y:auto;padding:2px 2px 20px;}
.subj-toolbar{display:flex;align-items:center;gap:8px;padding:2px 0 12px;}
.subj-toolbar h2{margin:0;font-size:18px;flex:1;}
.subj-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow);overflow:hidden;}
.subj-card-head{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;}
.swatch{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.subj-card-head .name{font-weight:700;flex:1;font-family:var(--font-head);font-size:15.5px;}
.subj-card-head .stats{font-size:11.5px;color:var(--ink-soft);font-weight:600;}
.progressbar{height:6px;border-radius:6px;background:var(--card-2);overflow:hidden;margin:0 14px 12px;}
.progressbar > div{height:100%;border-radius:6px;}
.subj-card-body{border-top:1px solid var(--line);padding:8px 10px 12px;display:none;}
.subj-card.open .subj-card-body{display:block;}
.subj-card.open .chevron{transform:rotate(90deg);}
.chevron{transition:.15s;color:var(--ink-soft);}
.chart-row{display:flex;align-items:flex-end;gap:6px;height:54px;margin:4px 8px 12px;}
.chart-bar{flex:1;border-radius:5px 5px 2px 2px;min-height:3px;position:relative;}
.chart-labels{display:flex;gap:6px;margin:0 8px 10px;}
.chart-labels div{flex:1;text-align:center;font-size:9.5px;color:var(--ink-soft);font-weight:600;}

.course-row{display:flex;align-items:center;gap:9px;padding:8px 6px;border-radius:9px;}
.course-row:hover{background:var(--card-2);}
.course-row .cname{flex:1;font-weight:600;font-size:13.5px;}
.course-row .meta{font-size:10.5px;color:var(--ink-soft);display:flex;gap:8px;align-items:center;}
.status-pill{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;
  cursor:pointer;border:none;white-space:nowrap;
}
.status-a_revoir{background:var(--danger-soft);color:var(--danger);}
.status-en_cours{background:var(--amber-soft);color:var(--amber);}
.status-maitrise{background:var(--accent-soft);color:var(--accent);}
.add-course-btn{display:flex;align-items:center;gap:7px;width:100%;padding:9px 10px;border-radius:9px;border:1px dashed var(--line);background:transparent;color:var(--ink-soft);font-weight:600;cursor:pointer;margin-top:4px;}
.add-course-btn:hover{border-color:var(--accent);color:var(--accent);}
.add-subject-card{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;border-radius:var(--radius);border:1.5px dashed var(--line);color:var(--ink-soft);font-weight:700;cursor:pointer;}
.add-subject-card:hover{border-color:var(--accent);color:var(--accent);}

.weak-box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);}
.weak-box h3{margin:0 0 9px;font-size:14px;display:flex;align-items:center;gap:7px;}
.weak-box h3 .icon{color:var(--danger);}
.weak-item{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;}
.weak-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.weak-item .cn{flex:1;font-weight:600;}
.weak-item .sn{color:var(--ink-soft);font-size:11.5px;}
.empty-note{color:var(--ink-soft);font-size:12.5px;padding:4px 2px;}

/* ---------- Today view ---------- */
.today-scroll{flex:1;overflow-y:auto;padding:2px 2px 20px;}
.today-head{display:flex;align-items:baseline;gap:10px;padding:2px 0 14px;}
.today-head h2{margin:0;font-size:19px;text-transform:capitalize;}
.today-head .count{font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.todo-item{
  display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow);
}
.todo-item.completed{opacity:.55;}
.todo-check{
  width:23px;height:23px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:transparent;transition:.15s;
}
.todo-check.checked{background:var(--accent);border-color:var(--accent);color:#fff;}
.todo-time{font-weight:700;font-size:12px;width:42px;flex-shrink:0;color:var(--ink-soft);}
.todo-main{flex:1;min-width:0;}
.todo-main .tt{font-weight:700;font-size:13.5px;}
.todo-main .ts{font-size:11px;color:var(--ink-soft);display:flex;gap:7px;align-items:center;margin-top:1px;}
.todo-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.todo-actions{display:flex;gap:4px;}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,20,28,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(2px);}
.overlay.active{display:flex;}
.modal{
  background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;
  max-height:88vh;overflow-y:auto;padding:18px 18px 22px;box-shadow:0 -10px 40px rgba(0,0,0,.25);
  animation:slideup .22s ease;
}
@media (min-width:640px){
  .overlay{align-items:center;}
  .modal{border-radius:18px;max-height:85vh;}
  @keyframes slideup{from{transform:translateY(14px);opacity:0;}to{transform:none;opacity:1;}}
}
@keyframes slideup{from{transform:translateY(26px);}to{transform:none;}}
.modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:17px;flex:1;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
.field input[type=text],.field input[type=date],.field input[type=time],.field input[type=number],.field select,.field textarea{
  width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
}
.field textarea{resize:vertical;min-height:62px;}
.row2{display:flex;gap:10px;}
.row2 > .field{flex:1;}
.chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
  cursor:pointer;font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:5px;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.chip.j-chip{background:var(--card-2);}
.chip.j-chip .rm{opacity:.6;}
.chip.j-chip:hover .rm{opacity:1;}
.chip-add{border-style:dashed;color:var(--ink-soft);}
.color-row{display:flex;flex-wrap:wrap;gap:8px;}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.color-dot.active{border-color:var(--ink);}
.modal-actions{display:flex;gap:9px;margin-top:16px;}
.modal-actions button{flex:1;}
.sub-note{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}
.divider{height:1px;background:var(--line);margin:16px 0;}
.mini-section-title{font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:8px;display:flex;align-items:center;gap:6px;}

.toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 10px 10px 18px;border-radius:999px;font-weight:600;font-size:13px;z-index:100;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:.2s;display:flex;align-items:center;gap:10px;white-space:nowrap;max-width:92vw;
}
.toast.show{opacity:1;transform:translate(-50%,-6px);pointer-events:auto;}
.toast-action{
  display:flex;align-items:center;gap:5px;background:var(--paper);color:var(--ink);border:none;
  padding:6px 12px;border-radius:999px;font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;
}

input[type=file]{display:none;}

@media (max-width:640px){
  .brand-text span{display:none;}
  .deadline-chip small{display:none;}
  .tabs button{padding:10px 6px;font-size:12.5px;}
}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark" id="logoIcon"></div>
      <div class="brand-text"><b>Planning PASS</b><span>Organise tes révisions</span></div>
    </div>
    <div class="deadline-chip" id="deadlineChip"></div>
    <div class="spacer-actions">
      <button class="iconbtn" id="searchBtn" title="Rechercher"></button>
      <button class="iconbtn" id="themeToggle" title="Mode sombre"></button>
      <button class="iconbtn" id="exportBtn" title="Exporter"></button>
      <button class="iconbtn" id="importBtn" title="Importer"></button>
      <input type="file" id="importFile" accept="application/json">
    </div>
  </div>

  <div id="backupBanner" class="backup-banner" style="display:none;"></div>

  <div class="tabs" id="tabs">
    <button data-tab="today" class="tab-btn"></button>
    <button data-tab="week" class="tab-btn"></button>
    <button data-tab="month" class="tab-btn"></button>
    <button data-tab="subjects" class="tab-btn"></button>
  </div>

  <main>

const LEGACY_STORAGE_KEY = 'planningPassData_v2';

const DEFAULT_J = [0,1,3,7,14,30];

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function pad2(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){ const r = new Date(d); const wd = (r.getDay()+6)%7; r.setDate(r.getDate()-wd); r.setHours(0,0,0,0); return r; }
function sameDate(a,b){ return toISODate(a)===toISODate(b); }
function minutesToHM(mins){ const h=Math.floor(mins/60), m=mins%60; return pad2(h)+':'+pad2(m); }
function hmToMinutes(hm){ const [h,m]=hm.split(':').map(Number); return h*60+m; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

function defaultState(){

      defaultJSequence: DEFAULT_J.slice(),

}

let state = load();
function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem(LEGACY_STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed || !parsed.subjects) return defaultState();
    parsed.settings = Object.assign(defaultState().settings, parsed.settings||{});
    parsed.courses = parsed.courses||[];
    parsed.blocks = parsed.blocks||[];
    const oldBuiltIns = ['UE1 · Chimie / Biochimie','UE2 · Biologie moléculaire','UE3 · Cytologie','UE4 · Physiologie','UE5 · Pharmacologie','UE6 · Sciences sociales'];
    if((parsed.version||0) < APP_VERSION){
      parsed.subjects.forEach((subj, i)=>{
        if(i < BASE_SUBJECTS.length && oldBuiltIns.includes(subj.name)){
          subj.name = BASE_SUBJECTS[i][0]; subj.color = BASE_SUBJECTS[i][1];
        }
      });
      parsed.version = APP_VERSION;
    }
    return parsed;
  }catch(e){ console.warn('Chargement impossible, réinitialisation.', e); return defaultState(); }
}

/* ============================== BLOCK OCCURRENCE RESOLUTION ============================== */
// Un block "recurring" a dayOfWeek(0=lundi..6=dim), startDate (première occurrence), start,duration, exceptions{date:{deleted}|{moved:{date,start,duration}}}
function occurrencesForRange(fromDate, toDateExcl){
  const out = [];
  for(const b of state.blocks){
    if(b.recurring){
      let cursor = parseISODate(b.startDate);
      // avancer au premier jour correspondant au dayOfWeek >= startDate
      const wd0 = (cursor.getDay()+6)%7;
      if(wd0 !== b.dayOfWeek){ cursor = addDays(cursor, (b.dayOfWeek - wd0 + 7)%7); }
      while(cursor < toDateExcl){
        if(cursor >= fromDate){
          const iso = toISODate(cursor);
          const ex = b.exceptions && b.exceptions[iso];
          if(!(ex && ex.deleted)){
            if(ex && ex.moved){
              out.push(Object.assign({}, b, {
                title: ex.moved.title || b.title,
                subjectId: ex.moved.subjectId || b.subjectId,
                occDate: ex.moved.date, occStart: ex.moved.start,
                occDuration: ex.moved.duration||b.duration,
                completed: typeof ex.moved.completed === 'boolean' ? ex.moved.completed : b.completed,
                isException:true, origDate:iso
              }));
            } else {
              out.push(Object.assign({}, b, {
                title: ex && ex.title || b.title,
                subjectId: ex && ex.subjectId || b.subjectId,
                occDate: iso, occStart: b.start, occDuration: b.duration,
                completed: ex && typeof ex.completed === 'boolean' ? ex.completed : b.completed,
                origDate:iso
              }));
            }
          }
        }
        cursor = addDays(cursor,7);
      }
    } else {
      const d = parseISODate(b.date);
      if(d>=fromDate && d<toDateExcl){
        out.push(Object.assign({}, b, {occDate:b.date, occStart:b.start, occDuration:b.duration, origDate:b.date}));
      }
    }
  }
  // occurrences déplacées vers une date hors de la série d'origine mais dans le range
  for(const b of state.blocks){
    if(b.recurring && b.exceptions){
      for(const origIso in b.exceptions){
        const ex = b.exceptions[origIso];
        if(ex.moved){
          const d = parseISODate(ex.moved.date);
          if(d>=fromDate && d<toDateExcl){
            const already = out.find(o=>o.id===b.id && o.origDate===origIso);
            if(!already){
              out.push(Object.assign({}, b, {
              title: ex.moved.title || b.title,
              subjectId: ex.moved.subjectId || b.subjectId,
              occDate: ex.moved.date, occStart: ex.moved.start,
              occDuration: ex.moved.duration||b.duration,
              completed: typeof ex.moved.completed === 'boolean' ? ex.moved.completed : b.completed,
              isException:true, origDate:origIso
            }));
            }
          }
        }
      }
    }
  }
  out.sort((a,b)=> a.occDate===b.occDate ? a.occStart.localeCompare(b.occStart) : a.occDate.localeCompare(b.occDate));
  return out;
}
function occurrencesForDay(iso){
  const d = parseISODate(iso);
  return occurrencesForRange(d, addDays(d,1)).filter(o=>o.occDate===iso);
}

/* ============================== J-METHOD SCHEDULING ============================== */
function jSequenceFor(course, subject){
  if(course && course.jSequence && course.jSequence.length) return course.jSequence.slice();
  if(subject && subject.jSequence && subject.jSequence.length) return subject.jSequence.slice();
  return state.settings.defaultJSequence.slice();
}
function durationForIndex(baseDuration, index, reviewCountOffset){
  const idx = index + (reviewCountOffset||0);
  const factor = Math.pow(0.85, idx);
  return Math.max(25, Math.round((baseDuration*factor)/5)*5);
}
function dayTotalMinutes(iso, excludeBlockKey){
  return occurrencesForDay(iso).reduce((sum,o)=>{
    const key = o.id+'|'+o.origDate;
    if(excludeBlockKey && key===excludeBlockKey) return sum;
    return sum + o.occDuration;
  },0);
}
function overlaps(aStart,aDur,bStart,bDur){
  const as=hmToMinutes(aStart), ae=as+aDur, bs=hmToMinutes(bStart), be=bs+bDur;
  return as<be && bs<ae;
}
const MIN_VISUAL_GAP_MIN = 30; // écart minimum entre deux blocs pour éviter le chevauchement visuel
function findFreeSlotSafe(iso, preferredHM, duration){
  const dayOcc = occurrencesForDay(iso);
  const dayStartMin = DAY_START*60, dayEndMin = DAY_END*60;
  const effDuration = Math.max(duration, MIN_VISUAL_GAP_MIN);
  const pref = clamp(hmToMinutes(preferredHM), dayStartMin, dayEndMin-duration);
  const candidates = [pref];
  for(let off=15; off<=(dayEndMin-dayStartMin); off+=15){
    if(pref+off <= dayEndMin-duration) candidates.push(pref+off);
    if(pref-off >= dayStartMin) candidates.push(pref-off);
  }
  for(const c of candidates){
    const hm = minutesToHM(c);
    // on vérifie avec une durée "effective" (jamais < 30min) pour garder un vrai espace visuel entre les blocs
    const clash = dayOcc.some(o=> overlaps(hm, effDuration, o.occStart, Math.max(o.occDuration, MIN_VISUAL_GAP_MIN)));
    if(!clash) return hm;
  }
  return null;
}
function generateRevisionsForCourse(course, subject, opts){
  const seq = jSequenceFor(course, subject);
  const start = parseISODate(opts.startDate);
  const created = [];
  seq.forEach((j, idx)=>{
    const date = addDays(start, j);
    const iso = toISODate(date);
    const duration = durationForIndex(opts.baseDuration, idx, 0);
    let slot = findFreeSlotSafe(iso, opts.preferredTime, duration);
    let finalIso = iso, tries=0;
    while(slot===null && tries<4){
      tries++;
      finalIso = toISODate(addDays(parseISODate(finalIso), 1));
      slot = findFreeSlotSafe(finalIso, opts.preferredTime, duration);
    }
    if(slot===null){ finalIso = iso; slot = opts.preferredTime; }
    const block = {
      id: uid(), type:'revision', courseId: course.id, subjectId: subject.id,
      title: course.name, date: finalIso, start: slot, duration,
      recurring:false, jIndex: idx, completed:false,
    };
    state.blocks.push(block);
    created.push(block);
  });
  return created;
}

  // (panneau qui s'ouvre/s'anime), on recalcule une fois la mise en page stabilisée.
  requestAnimationFrame(()=> requestAnimationFrame(()=>{ if(ui.tab==='week') renderWeek(); }));

  switchTab._t = setTimeout(()=>{ if(ui.tab==='week') renderWeek(); }, 350);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================== WEEK VIEW ============================== */
function renderWeek(){
  const gutter = document.getElementById('gutter');
  const daysScroll = document.getElementById('daysScroll');
  const totalHours = DAY_END-DAY_START;
  const hourPx = getHourPx();
  document.documentElement.style.setProperty('--hour-px', hourPx+'px');

  const dayHeadH = 48;
  gutter.style.height = (dayHeadH + totalHours*hourPx)+'px';
  gutter.innerHTML = '<div class="gutter-head"></div>';
  for(let h=DAY_START; h<=DAY_END; h++){
    const lab = document.createElement('div');
    lab.className='lab';
    lab.style.top = (dayHeadH + ((h-DAY_START)*hourPx))+'px';
    lab.textContent = h+'h';
    gutter.appendChild(lab);
  }

  const weekStart = ui.weekAnchor;
  const weekEnd = addDays(weekStart,7);
  document.getElementById('weekRange').textContent = fmtWeekRange(weekStart);

  daysScroll.innerHTML = '';
  const todayIso = toISODate(new Date());
  let overloadedDays = [];

  for(let i=0;i<7;i++){
    const dDate = addDays(weekStart,i);
    const iso = toISODate(dDate);
    const col = document.createElement('div');
    col.className='day-col';
    const head = document.createElement('div');
    head.className='day-head'+(iso===todayIso?' today':'');
    head.innerHTML = '<div class="dname">'+DAY_NAMES[i]+'</div><div class="dnum">'+dDate.getDate()+'</div>';
    col.appendChild(head);
    const body = document.createElement('div');
    body.className='day-body'; body.style.height=(totalHours*hourPx)+'px'; body.dataset.date=iso;
    for(let h=DAY_START; h<=DAY_END; h++){
      const hl=document.createElement('div'); hl.className='hourline'; hl.style.top=((h-DAY_START)*hourPx)+'px';
      body.appendChild(hl);
      if(h < DAY_END){
        const half=document.createElement('div'); half.className='hourline half'; half.style.top=(((h-DAY_START)+0.5)*hourPx)+'px';
        body.appendChild(half);
      }
    }
    if(iso===todayIso){
      const now=new Date();
      const mins = now.getHours()*60+now.getMinutes();
      const startMin = DAY_START*60;
      if(mins>=startMin && mins<=DAY_END*60){
        const nl=document.createElement('div'); nl.className='now-line';
        nl.style.top=(((mins-startMin)/60)*hourPx)+'px';
        body.appendChild(nl);
      }
    }
    const occ = occurrencesForDay(iso);
    const total = occ.reduce((s,o)=>s+o.occDuration,0);
    if(total > state.settings.dayCapMinutes) overloadedDays.push(iso);
    occ.forEach(o=> body.appendChild(renderBlockEl(o, hourPx)));
    attachDayDrop(body);
    body.addEventListener('dblclick', e=>{
      if(e.target !== body && !e.target.classList.contains('hourline')) return;
      const rect = body.getBoundingClientRect();
      const minsFromStart = clamp((e.clientY-rect.top)/hourPx*60, 0, totalHours*60-15);
      const snapped = Math.round(minsFromStart/15)*15;
      openAddBlockModal(iso, minutesToHM(DAY_START*60 + snapped));
    });
    col.appendChild(body);
    daysScroll.appendChild(col);
  }
  renderOverloadBanner(overloadedDays);
}
function getHourPx(){
  const wrap = document.querySelector('.week-wrap');
  const totalHours = DAY_END-DAY_START;
  if(!wrap) return 44;
  const dayHeadH = 48;
  const avail = Math.max(320, wrap.clientHeight - dayHeadH);
  const fitPx = Math.floor(avail/totalHours);
  return clamp(fitPx, 30, 82);
}
function fmtWeekRange(ws){
  const we = addDays(ws,6);
  const sameMonth = ws.getMonth()===we.getMonth();
  const a = ws.getDate()+' '+(sameMonth?'':MONTH_NAMES[ws.getMonth()]+' ');
  const b = we.getDate()+' '+MONTH_NAMES[we.getMonth()]+' '+we.getFullYear();
  return (a+'– '+b).replace('  ',' ');
}
function renderOverloadBanner(days){
  const slot = document.getElementById('overloadSlot');
  slot.innerHTML='';
  if(!days.length) return;
  const b = document.createElement('div');
  b.className='overload-banner';
  const names = days.map(iso=>{
    const d=parseISODate(iso);
    return DAY_NAMES[(d.getDay()+6)%7];
  }).join(', ');
  b.innerHTML = ic('alert') + '<span>Journée chargée : '+names+'</span>';
  const btn=document.createElement('button'); btn.className='pill'; btn.textContent='Rééquilibrer';
  btn.onclick = ()=> rebalanceDays(days);
  b.appendChild(btn);
  slot.appendChild(b);
}
function rebalanceDays(days){
  let moved=0;
  days.forEach(iso=>{
    let occ = occurrencesForDay(iso).filter(o=>o.type==='revision' && !o.recurring);
    let total = dayTotalMinutes(iso);
    occ.sort((a,b)=> b.occDuration-a.occDuration);
    for(const o of occ){
      if(total <= state.settings.dayCapMinutes) break;
      const block = state.blocks.find(x=>x.id===o.id);
      if(!block) continue;
      for(let shift=1; shift<=5; shift++){
        const cand = toISODate(addDays(parseISODate(iso), shift));
        if(dayTotalMinutes(cand) + block.duration <= state.settings.dayCapMinutes){
          const slot = findFreeSlotSafe(cand, block.start, block.duration);
          if(slot){
            block.date = cand; block.start = slot;
            total -= block.duration; moved++;
            break;
          }
        }
      }
    }
  });
  save();
  toast(moved? (moved+' session(s) déplacée(s)') : "Impossible de tout rééquilibrer, essaie de déplacer manuellement");
  renderActiveView();
}
function renderBlockEl(o, hourPx){
  const el = document.createElement('div');
  el.className='block'+(o.type==='revision'?' revision':'')+(o.completed?' completed':'');
  const startMin = hmToMinutes(o.occStart) - DAY_START*60;
  el.style.top = ((startMin/60)*hourPx)+'px';
  el.style.height = Math.max(26,((o.occDuration/60)*hourPx)-2)+'px';
  const color = subjColor(o.subjectId);
  el.style.background = hexToRgba(color, state.settings.darkMode?0.26:0.15);
  el.style.borderLeftColor = color;
  el.style.color = color;
  el.dataset.blockId = o.id;
  el.dataset.origDate = o.origDate || o.occDate;
  el.dataset.isRecurring = o.recurring? '1':'0';
  const endHM = minutesToHM(hmToMinutes(o.occStart)+o.occDuration);
  el.innerHTML = '<div class="t">'+(o.recurring?ic('repeat','icon-sm'):'')+' '+esc(o.title)+'</div><div class="s">'+o.occStart+'-'+endHM+'</div>';
  el.addEventListener('pointerdown', e=>startBlockDrag(e, o));
  el.addEventListener('click', e=>{ if(el.dataset.dragged==='1'){ el.dataset.dragged='0'; return;} openBlockModal(o); });
  return el;
}
function attachDayDrop(body){ /* drop géré via pointer tracking global */ }

function startBlockDrag(e, occ){
  e.preventDefault();
  const el = e.currentTarget;
  el.setPointerCapture(e.pointerId);
  const hourPx = getHourPx();
  const startY = e.clientY;
  const startX = e.clientX;
  const origTop = parseFloat(el.style.top);
  const daysScroll = document.getElementById('daysScroll');
  const colsEls = Array.from(daysScroll.querySelectorAll('.day-col'));
  const origColIdx = colsEls.findIndex(c=> c.querySelector('.day-body').contains(el) );
  let moved=false;
  function onMove(ev){
    const dy = ev.clientY - startY;
    const dx = ev.clientX - startX;
    if(Math.abs(dy)>4 || Math.abs(dx)>4){ moved=true; el.classList.add('dragging'); }
    let newTop = origTop + dy;
    const totalHours = DAY_END-DAY_START;
    newTop = clamp(newTop, 0, totalHours*hourPx - el.offsetHeight);
    // snap 15min
    const stepPx = hourPx/4;
    newTop = Math.round(newTop/stepPx)*stepPx;
    el.style.top = newTop+'px';
    const colWidth = colsEls[0].clientWidth;
    let colIdx = clamp(origColIdx + Math.round(dx/colWidth), 0, 6);
    if(colIdx!==origColIdx){
      colsEls[colIdx].querySelector('.day-body').appendChild(el);
    }
    el.dataset.targetCol = colIdx;
  }
  function onUp(ev){
    el.releasePointerCapture(e.pointerId);
    el.removeEventListener('pointermove', onMove);
    el.removeEventListener('pointerup', onUp);
    el.classList.remove('dragging');
    if(!moved) return;
    el.dataset.dragged='1';
    const newTop = parseFloat(el.style.top);
    const startMin = DAY_START*60 + Math.round((newTop/hourPx)*60/15)*15;
    const newStart = minutesToHM(clamp(startMin, DAY_START*60, DAY_END*60-15));
    const colIdx = el.dataset.targetCol!==undefined? Number(el.dataset.targetCol) : origColIdx;
    const newDate = toISODate(addDays(ui.weekAnchor, colIdx));
    commitBlockMove(occ, newDate, newStart);
  }
  el.addEventListener('pointermove', onMove);
  el.addEventListener('pointerup', onUp);
}
function commitBlockMove(occ, newDate, newStart){
  const block = state.blocks.find(b=>b.id===occ.id);
  if(!block) return;
  if(!block.recurring){
    pushUndo();
    block.date = newDate; block.start = newStart;
    save(); renderActiveView(); toast('Créneau déplacé', {label:'Annuler', onClick:undoLast});
    return;
  }
  askRecurringScope('Déplacer', function(scope){
    if(scope==='occurrence'){
      pushUndo();
      block.exceptions = block.exceptions||{};
      block.exceptions[occ.origDate] = { moved:{ date:newDate, start:newStart, duration: block.duration } };
    } else if(scope==='series'){
      pushUndo();
      const newDow = (parseISODate(newDate).getDay()+6)%7;
      block.dayOfWeek = newDow;
      block.start = newStart;
      block.startDate = newDate;
    } else { renderActiveView(); return; }
    save(); renderActiveView(); toast(scope==='series'? 'Série déplacée' : 'Occurrence déplacée', {label:'Annuler', onClick:undoLast});
  });
}
function askRecurringScope(actionLabel, cb){
  openModal(`
    <div class="modal-head"><h3>${actionLabel} — cours récurrent</h3><button class="iconbtn" data-close>${ic('x')}</button></div>
    <p class="sub-note" style="margin-bottom:14px;">Ce cours se répète chaque semaine. Que veux-tu faire ?</p>
    <div class="modal-actions" style="flex-direction:column;">
      <button class="secondary" id="scopeOcc">Seulement cette occurrence</button>
      <button class="primary" id="scopeSeries">Toute la série</button>
    </div>
  `);
  document.getElementById('scopeOcc').onclick = ()=>{ closeModal(); cb('occurrence'); };
  document.getElementById('scopeSeries').onclick = ()=>{ closeModal(); cb('series'); };
  document.querySelector('[data-close]').onclick = ()=>{ closeModal(); cb(null); };
}

        </div>

function findOccByKey(key){
  const [id, origDate] = key.split('|');
  const d = parseISODate(origDate);
  const list = occurrencesForRange(d, addDays(d,1));
  return list.find(o=> o.id===id && (o.origDate||o.occDate)===origDate);
}
function toggleOccCompleted(key){
  const occ = findOccByKey(key);
  if(!occ) return;
  const block = state.blocks.find(b=>b.id===occ.id);
  if(!block) return;
  if(!block.recurring){
    block.completed = !block.completed;
    if(block.completed && block.type==='revision' && block.courseId){
      const c = getCourse(block.courseId);
      if(c){ c.reviewCount = (c.reviewCount||0)+1; c.timeSpentMin = (c.timeSpentMin||0)+block.duration; }
    }
  } else {
    block.exceptions = block.exceptions||{};
    const ex = block.exceptions[occ.origDate] || {};
    ex.completed = !ex.completed;
    if(ex.moved){ ex.moved.completed = ex.completed; }
    block.exceptions[occ.origDate] = ex;
  }
  save();
  renderActiveView();
}
function postponeOcc(key){
  const occ = findOccByKey(key);
  if(!occ) return;
  const newDate = toISODate(addDays(parseISODate(occ.occDate),1));
  commitBlockMove(occ, newDate, occ.occStart);
}
// patch occurrencesForRange to reflect .completed for exceptions
const _origOccForRange = occurrencesForRange;
occurrencesForRange = function(fromDate, toDateExcl){
  const list = _origOccForRange(fromDate, toDateExcl);
  return list.map(o=>{
    if(o.isException){
      const block = state.blocks.find(b=>b.id===o.id);
      const ex = block && block.exceptions && block.exceptions[o.origDate];
      o.completed = ex && !!ex.completed;
    }
    return o;
  });
};

function renderWeakBox(){

function renderWeekChart(subj){
  const weekStart = ui.weekAnchor;

  const perDay = [0,0,0,0,0,0,0];
  occAll.forEach(o=>{
    const idx = Math.round((parseISODate(o.occDate)-weekStart)/86400000);
    if(idx>=0 && idx<7) perDay[idx]+=o.occDuration;
  });
  const max = Math.max(60, ...perDay);
  return `<div class="chart-row">${perDay.map(m=>`<div class="chart-bar" style="height:${Math.max(3,(m/max)*100)}%;background:${subj.color}${m?'':'22'}"></div>`).join('')}</div>

function cycleStatus(courseId){
  const c = getCourse(courseId); if(!c) return;
  const order = ['a_revoir','en_cours','maitrise'];
  const next = order[(order.indexOf(c.status||'a_revoir')+1)%order.length];
  c.status = next;
  save(); renderSubjects();
}

      });
    }
  };
  document.getElementById('bDelete').onclick = ()=>{
    if(!block.recurring){
      askConfirm('Supprimer ce créneau ?', 'Supprimer', ()=>{
        pushUndo();
        state.blocks = state.blocks.filter(b=>b.id!==block.id);

      });
    } else {
      askRecurringScope('Supprimer', scope=>{

          block.exceptions = block.exceptions||{};
          block.exceptions[occ.origDate] = { deleted:true };

          state.blocks = state.blocks.filter(b=>b.id!==block.id);
          save(); renderActiveView(); toast('Série supprimée', {label:'Annuler', onClick:undoLast});

      });
    }
  };

}

/* ============================== EXPORT / IMPORT ============================== */
function doExport(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'planning-pass-'+toISODate(new Date())+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  state.settings.lastExportAt = toISODate(new Date());
  state.settings.exportReminderSnoozeUntil = null;
  save();
  hideBackupBanner();
  toast('Export téléchargé');
}
/* ============================== RAPPEL DE SAUVEGARDE ============================== */
const BACKUP_REMINDER_DAYS = 7;
function checkBackupReminder(){
  const hasData = state.courses.length>0 || state.blocks.length>0;
  if(!hasData) return;
  const today = new Date();
  const snooze = state.settings.exportReminderSnoozeUntil;
  if(snooze && parseISODate(snooze) > today) return;
  const last = state.settings.lastExportAt;
  const daysSince = last ? Math.floor((today - parseISODate(last))/86400000) : Infinity;
  if(daysSince >= BACKUP_REMINDER_DAYS) showBackupBanner(last);
}
function showBackupBanner(last){
  const el = document.getElementById('backupBanner');
  const msg = last
    ? `Ta dernière sauvegarde date de plus de ${BACKUP_REMINDER_DAYS} jours — pense à exporter tes données.`
    : `Tu n'as encore jamais exporté tes données — un petit export vaut mieux qu'un pépin.`;
  el.innerHTML = `${ic('download','icon-sm')}<span class="txt">${esc(msg)}</span>
    <div class="bb-actions">
      <button class="pill" id="bbExportBtn">Exporter</button>
      <button class="iconbtn" id="bbDismissBtn">${ic('x','icon-sm')}</button>
    </div>`;
  el.style.display = 'flex';
  document.getElementById('bbExportBtn').onclick = doExport;
  document.getElementById('bbDismissBtn').onclick = ()=>{
    const snooze = addDays(new Date(), 3);
    state.settings.exportReminderSnoozeUntil = toISODate(snooze);
    save();
    hideBackupBanner();
  };
}
function hideBackupBanner(){
  document.getElementById('backupBanner').style.display = 'none';
}

/* ============================== RECHERCHE ============================== */
function normalizeStr(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function openSearchModal(){
  openModal(`
    <div class="modal-head"><h3>${ic('search','icon-sm')} Rechercher</h3><button class="iconbtn" data-close>${ic('x')}</button></div>
    <div class="field"><input type="text" id="searchInput" placeholder="Nom d'un cours, d'une matière..."></div>
    <div id="searchResults"></div>
  `);
  const input = document.getElementById('searchInput');
  const resultsEl = document.getElementById('searchResults');
  function runSearch(q){
    const nq = normalizeStr(q);
    if(!nq){ resultsEl.innerHTML = '<div class="empty-note">Tape pour chercher un cours, une matière, ou un créneau.</div>'; return; }
    const courseResults = state.courses.filter(c=>
      normalizeStr(c.name).includes(nq) || normalizeStr(getSubject(c.subjectId)?.name||'').includes(nq));
    const linkedIds = new Set(courseResults.map(c=>c.id));
    const blockResults = state.blocks.filter(b=> !b.courseId && normalizeStr(b.title).includes(nq));
    if(!courseResults.length && !blockResults.length){ resultsEl.innerHTML = '<div class="empty-note">Aucun résultat.</div>'; return; }
    let html = '';
    courseResults.forEach(c=>{
      const s = getSubject(c.subjectId);
      const statusLabel = {a_revoir:'À revoir', en_cours:'En cours', maitrise:'Maîtrisé'}[c.status||'a_revoir'];
      html += `<div class="search-row" data-open-course-result="${c.id}">
        <span class="swatch" style="background:${s?s.color:'#888'}"></span>
        <span class="srn">${esc(c.name)}</span>
        <span class="srs">${s?esc(s.name)+' · ':''}${statusLabel}</span>
      </div>`;
    });
    blockResults.forEach(b=>{
      html += `<div class="search-row" data-jump-block-result="${b.id}">
        <span class="swatch" style="background:${subjColor(b.subjectId)}"></span>
        <span class="srn">${esc(b.title)}</span>
        <span class="srs">${b.recurring?'Cours récurrent':'Créneau'}</span>
      </div>`;
    });
    resultsEl.innerHTML = html;
    resultsEl.querySelectorAll('[data-open-course-result]').forEach(el=>{
      el.onclick = ()=>{ closeModal(); openCourseModal(getCourse(el.dataset.openCourseResult)); };
    });
    resultsEl.querySelectorAll('[data-jump-block-result]').forEach(el=>{
      el.onclick = ()=>{
        const b = state.blocks.find(x=>x.id===el.dataset.jumpBlockResult);
        if(b){
          const d = b.recurring ? b.startDate : b.date;
          ui.weekAnchor = startOfWeek(parseISODate(d));
          closeModal(); switchTab('week');
        }
      };
    });
  }
  input.addEventListener('input', e=>runSearch(e.target.value));
  runSearch('');
  setTimeout(()=>input.focus(), 50);
  document.querySelector('[data-close]').onclick = closeModal;
}

function doImport(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{
      data = JSON.parse(reader.result);
      if(!data.subjects || !data.blocks){ toast('Fichier invalide'); return; }
    }catch(e){ toast('Impossible de lire ce fichier'); return; }
    askConfirm('Importer remplacera toutes les données actuelles. Continuer ?', 'Importer', ()=>{
      pushUndo();
      state = data;
      state.settings = Object.assign(defaultState().settings, state.settings||{});
      save();
      renderStaticChrome(); renderActiveView();
      toast('Import réussi', {label:'Annuler', onClick:undoLast});
    });
  };
  reader.readAsText(file);
}

/* ============================== EVENTS ============================== */
document.querySelectorAll('.tab-btn').forEach(b=> b.addEventListener('click', ()=>switchTab(b.dataset.tab)) );
document.getElementById('themeToggle').addEventListener('click', ()=>{
  state.settings.darkMode = !state.settings.darkMode; save(); renderStaticChrome();
});
document.getElementById('exportBtn').addEventListener('click', doExport);
document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{ if(e.target.files[0]) doImport(e.target.files[0]); e.target.value=''; });
document.getElementById('deadlineChip').addEventListener('click', openDeadlineModal);
document.getElementById('searchBtn').addEventListener('click', openSearchModal);

document.getElementById('weekPrev').addEventListener('click', ()=>{ ui.weekAnchor = addDays(ui.weekAnchor,-7); renderWeek(); });
document.getElementById('weekNext').addEventListener('click', ()=>{ ui.weekAnchor = addDays(ui.weekAnchor,7); renderWeek(); });
document.getElementById('weekToday').addEventListener('click', ()=>{ ui.weekAnchor = startOfWeek(new Date()); renderWeek(); });
document.getElementById('addBlockBtn').addEventListener('click', openAddBlockModal);

document.getElementById('monthPrev').addEventListener('click', ()=>{ ui.monthAnchor = new Date(ui.monthAnchor.getFullYear(), ui.monthAnchor.getMonth()-1, 1); renderMonth(); });
document.getElementById('monthNext').addEventListener('click', ()=>{ ui.monthAnchor = new Date(ui.monthAnchor.getFullYear(), ui.monthAnchor.getMonth()+1, 1); renderMonth(); });
document.getElementById('monthToday').addEventListener('click', ()=>{ ui.monthAnchor = new Date(); renderMonth(); });

window.addEventListener('resize', ()=>{ if(ui.tab==='week') renderWeek(); });
if(window.ResizeObserver){
  let roTimer=null;
  const ro = new ResizeObserver(()=>{
    clearTimeout(roTimer);
    roTimer = setTimeout(()=>{ if(ui.tab==='week') renderWeek(); }, 60);
  });
  const wrapEl = document.querySelector('.week-wrap');
  if(wrapEl) ro.observe(wrapEl);
}

/* ============================== INIT ============================== */
renderStaticChrome();
switchTab('today');
checkBackupReminder();
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* pas grave hors contexte sécurisé (https) */ });
  });
}
})();
</script>
</body>
</html>
